[project]
name = "insurmind-chatbot"
version = "0.1.0"
description = "Chatbot de cotação de seguros de automóveis — Atividade Obrigatória 2, I2A2 InsurMinds"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0,<0.2.0",
    "anthropic>=0.40",     # provider anthropic_api (loop manual, sem CLI — pré-requisito de deploy cloud)
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "streamlit>=1.40",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "google-genai>=1.0",   # provider Gemini (controle manual de tool calls — pré-requisito do Modo Debug)
    "fastapi>=0.110",      # backend HTTP da nova UI Next.js (Fase 1 da Sprint 3)
    "uvicorn[standard]>=0.27",  # ASGI server pro FastAPI
    "sse-starlette>=2.0",  # Server-Sent Events nativos pra Starlette/FastAPI
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
dataprep = [
    "pypdf>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurmind"]
